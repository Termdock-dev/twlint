# 在 GitHub 發布 Release 時，把該 tag 的程式碼發布到 npm。
# 用 npm Trusted Publishing（OIDC）發布，不需要 npm token，也不需要一次性密碼。
# npmjs.com 上的設定：Termdock-dev / twlint / publish.yml，允許 npm publish。
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check that the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm ci
      # dict:build 會略過格式錯誤的列，發布前另外驗證所有 CSV
      - run: npm run dict:validate
      - run: npm run build
      - run: npx vitest run
      - run: npm publish
